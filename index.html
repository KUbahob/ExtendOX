<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- ExtendOX build v5.1 -->
<meta name="version" content="5.1" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>ExtendOX</title>
<meta name="description" content="Tic-Tac-Toe on a board that keeps growing. Get 4, 5 or 6 in a row." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ExtendOX" />
<meta name="mobile-web-app-capable" content="yes" />
<meta property="og:title" content="ExtendOX" />
<meta property="og:description" content="Tic-Tac-Toe on a board that keeps growing. Get 4, 5 or 6 in a row." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ExtendOX — design tokens (from "Typogrophy & Colours.jpg")
   ============================================================ */
:root{
  --bg:              #FFFFFF;
  --ink:             #000000;
  --red:             #EA5A47;                /* Player X (cross)  */
  --blue:            #4472C4;                /* Player O (circle) */
  --ext:             rgba(217,217,217,.9);   /* D9D9D9 @ 90% — extension bar */
  --ext-sep:         #C2C2C2;                /* separators drawn inside a bar */
  --toggle-on:       rgba(68,114,196,.75);   /* 4472C4 75% */
  --toggle-off:      rgba(234,90,71,.75);    /* EA5A47 75% */
  --clock-blue-off:  rgba(68,114,196,.25);
  --clock-blue-on:   rgba(68,114,196,.5);
  --clock-red-off:   rgba(234,90,71,.25);
  --clock-red-on:    rgba(234,90,71,.5);
  --play:            rgba(146,208,80,.5);    /* 92D050 50% */
  --surface-soft:    rgba(0,0,0,.03);        /* settings & imprint background */
  --chip:            #F2F2F2;

  --r:               15px;                   /* Effects → Rounding 15 px */
  /* Effects → Shadow 0 / 1 / 4 / 2 @ 25 %. CSS renders that noticeably heavier
     than Figma does, so the alpha is tuned down to match the mock-ups.        */
  --shadow:          0 1px 4px 2px rgba(0,0,0,.12);

  --fs-small: 12px;   /* imprint                            */
  --fs-body:  13px;   /* long-form copy (tutorial)          */
  --fs-mid:   17px;   /* clocks, end-game pop-up, list rows */
  --fs-std:   20px;   /* standard label / heading / button  */

  --pad:      22px;   /* screen side padding                */
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#fff}
body{
  display:flex;align-items:center;justify-content:center;
  /* Open Sans covers Latin + Cyrillic; the rest fall through per character to
     the system Chinese / Devanagari faces. */
  font-family:'Open Sans','Segoe UI','Microsoft YaHei','PingFang SC','Nirmala UI',
              'Noto Sans SC','Noto Sans Devanagari',system-ui,-apple-system,sans-serif;
  font-size:var(--fs-std);color:var(--ink);overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
/* every icon is block-level: an inline <svg> sits on the text baseline, which
   pushes it a few px above the centre of its button. */
svg{display:block}
.tint{display:flex;align-items:center;justify-content:center}

#app{
  position:relative;
  width:min(100vw,430px);
  height:100dvh;max-height:960px;
  background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
@media (min-width:520px) and (min-height:780px){
  #app{border-radius:26px;box-shadow:0 10px 44px rgba(0,0,0,.16)}
}
@media (orientation:landscape) and (max-height:540px){
  #app{width:100vw;max-height:none;border-radius:0;box-shadow:none}
  .screen{width:100%;max-width:560px;margin-inline:auto}
}

/* ---------------------------- generic frame ------------------------------ */
.screen{
  position:relative;flex:1;min-height:0;
  display:flex;flex-direction:column;
  padding:max(18px,env(safe-area-inset-top)) var(--pad) max(20px,env(safe-area-inset-bottom));
}
/* scrollbar-gutter keeps the centred column in the same place whether or not a
   screen happens to scroll — otherwise the back button shifts by half a bar */
.screen.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.sp{flex:0 0 auto}

/* -------------------------------- pieces --------------------------------- */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow)}

.iconbtn{
  width:68px;height:44px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;gap:4px;
  background:#fff;border-radius:var(--r);box-shadow:var(--shadow);
  transition:transform .12s ease;
}
.iconbtn:active{transform:scale(.95)}
.iconbtn[disabled]{opacity:.3;cursor:default}
.iconbtn[disabled]:active{transform:none}
.iconbtn.off{opacity:.3}          /* switched off in the settings, still tappable */
.iconbtn.flat{width:34px;height:34px;box-shadow:none;border-radius:9px}
.iconbtn.mini-btn{width:48px;height:34px;border-radius:11px}
.emo24{font-size:22px;line-height:1}

.btn-play{
  background:var(--play);border-radius:var(--r);box-shadow:var(--shadow);
  font-size:var(--fs-std);font-weight:700;color:var(--ink);
  padding:11px 28px;transition:transform .12s ease;
}
.btn-play:active{transform:scale(.97)}
.btn-play.red{background:var(--toggle-off)}    /* EA5A47 75 % — as Time Limit off */
.btn-play.blue{background:var(--toggle-on)}    /* 4472C4 75 % — as Time Limit on  */

/* Play Now above Play a bot, both centred and the same width */
.play-stack{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.play-stack .btn-play{width:max-content;min-width:172px;text-align:center}
/* holds the place of Play Now on the Play-a-bot screen, so that button and the
   card below it stay exactly where they were on the home screen */
.slot-ghost{visibility:hidden;pointer-events:none}

/* Fixed vertical rhythm for the home and Play-a-bot screens. Proportional
   spacers would shift the buttons and the card whenever the card got shorter,
   which is exactly the jump this avoids — so these must not flex. The screen
   scrolls instead when there is not enough room. */
.gap-brand{flex:0 0 auto;height:clamp(30px,15vh,122px)}
.gap-play {flex:0 0 auto;height:clamp(18px,6vh,50px)}
.gap-rest {flex:1 1 auto;min-height:10px}
.screen-home{overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}

/* shorter screens: tighten the rhythm so it usually still fits without scrolling */
@media (max-height:700px){
  .gap-brand{height:clamp(20px,8vh,70px)}
  .gap-play {height:clamp(12px,3.5vh,32px)}
}

/* mark picker: the chosen mark keeps its colour on a light grey box, the other
   is greyed out with no box */
.pieces{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.piece{
  width:48px;height:42px;display:flex;align-items:center;justify-content:center;
  border-radius:12px;background:transparent;opacity:.3;
  transition:opacity .15s ease,background .15s ease,transform .12s ease;
}
.piece.sel{opacity:1;background:var(--chip)}
.piece:active{transform:scale(.94)}

.title{font-size:var(--fs-std);font-weight:700;text-align:center}

/* the assets used straight from ./icons/ */
.logo-img{display:block;width:98px;height:98px;margin-bottom:2px}
.wordmark-img{display:block;height:24px;width:auto}
.wordmark-img.big{height:28px}
.party-img{display:block;width:112px;height:112px;flex:0 0 auto}

/* ============================================================
   HOME
   ============================================================ */
.home-top{display:flex;justify-content:space-between;align-items:flex-start;flex:0 0 auto}
.home-brand{
  flex:0 0 auto;margin-top:-6px;
  display:flex;flex-direction:column;align-items:center;gap:0;
}
.settings-card{flex:0 0 auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.screen.scroll .settings-card{margin-bottom:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row-label{font-size:var(--fs-std);line-height:1.3}

.toggle{
  width:62px;height:34px;border-radius:999px;position:relative;flex:0 0 auto;
  background:var(--toggle-off);transition:background .18s ease;
}
.toggle.on{background:var(--toggle-on)}
.toggle i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;
  background:#fff;transition:left .18s ease}
.toggle.on i{left:31px}

.chip{
  background:var(--chip);border-radius:12px;padding:7px 16px;
  font-size:var(--fs-std);min-width:76px;text-align:center;
  font-variant-numeric:tabular-nums;flex:0 0 auto;
}
.chip.off{opacity:.5}
.numchip{display:inline-flex;align-items:baseline;justify-content:center;gap:5px}
.numchip .num{
  width:2.3ch;border:0;background:none;padding:0;margin:0;outline:none;
  font:inherit;color:inherit;text-align:right;font-variant-numeric:tabular-nums;
}
.numchip .num:focus{color:var(--blue)}
.numchip .unit{font-size:14px;opacity:.55}

/* ---------------- playing-mode dropdown ---------------- */
/* the chip may shrink and clip its grey hint rather than push out of the row */
.selwrap{position:relative;flex:0 1 auto;min-width:0}
.selchip{
  display:inline-flex;align-items:baseline;gap:7px;max-width:100%;
  padding:7px 11px 7px 16px;min-width:0;
  transition:transform .12s ease,background .15s ease;
}
.selchip:active{transform:scale(.97)}
.selchip.open{background:#E9E9E9}
.selchip .num{white-space:nowrap;flex:0 0 auto}
.selchip .unit{font-size:14px;opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.selchip .caret{align-self:center;display:flex;opacity:.45;flex:0 0 auto;transition:transform .18s ease}
.selchip.open .caret{transform:rotate(180deg)}

.selmenu{
  position:absolute;z-index:30;top:calc(100% + 8px);right:0;min-width:100%;
  background:#fff;border-radius:var(--r);box-shadow:var(--shadow);
  overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
  animation:menuin .16s ease both;
}
@keyframes menuin{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
/* flipped above the chip when there is no room below */
.selmenu.up{top:auto;bottom:calc(100% + 8px);animation-name:menuup}
@keyframes menuup{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.selmenu button{
  width:100%;display:flex;align-items:baseline;gap:8px;white-space:nowrap;
  padding:12px 18px;font-size:var(--fs-mid);text-align:left;
}
.selmenu button + button{border-top:1px solid rgba(0,0,0,.7)}
.selmenu .hint{font-size:14px;opacity:.5;margin-left:auto}
.selmenu .sel{background:var(--surface-soft)}
.selmenu .sel .name{font-weight:700}

/* ============================================================
   GAME
   ============================================================ */
.topbar{
  flex:0 0 48px;height:48px;
  background:#fff;border-radius:var(--r);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:space-between;padding:0 12px;
}
.clocks{display:flex;gap:10px}
.clock{
  font-size:var(--fs-mid);line-height:1;border-radius:999px;padding:7px 13px;
  font-variant-numeric:tabular-nums;border:1.5px solid transparent;
  transition:background .25s ease;
}
.clock.blue{background:var(--clock-blue-off)}
.clock.blue.active{background:var(--clock-blue-on)}
.clock.red{background:var(--clock-red-off)}
.clock.red.active{background:var(--clock-red-on)}
.clock.dead{background:#fff;border-color:var(--ink)}

/* the same safe distance as on the sides is kept above and below the board */
.board-area{
  position:relative;flex:1;min-height:0;margin:var(--pad) 0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
/* padding-bottom is set from JS so the bottom note never covers the board */
.board-area.zoomable{touch-action:none;cursor:grab}
.board-area.zoomable:active{cursor:grabbing}

/* flex-shrink MUST stay 0: the cells are absolutely positioned, so a shrunk box
   would still paint them at full width while transform-origin (50% 50%) moved to
   the middle of the shrunk box — the board would slide off to the right. */
.board{position:relative;flex:0 0 auto;transform-origin:50% 50%;transition:transform .2s ease}
.board.nudge,.board.static{transition:none}
.board.faded{opacity:.25}
.board .cell{position:absolute;display:flex;align-items:center;justify-content:center}
.board .cell.live{cursor:pointer}
.board .cell.live:active{background:rgba(0,0,0,.04)}
.board .gl{position:absolute}
.glyph{display:block}
.glyph.pop{animation:pop .2s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}

.ghost{position:absolute;background:var(--ext);animation:fadein .22s ease both;transition:filter .1s ease}
.ghost[data-act]{cursor:pointer}
.ghost[data-act]:active{filter:brightness(.93)}
.ghost .gsep{position:absolute;background:var(--ext-sep)}
.ghost .gplus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.winline{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}

.notice{
  position:absolute;left:var(--pad);right:var(--pad);
  bottom:calc(max(20px,env(safe-area-inset-bottom)) + 60px);
  background:#fff;border-radius:var(--r);box-shadow:var(--shadow);
  padding:11px 16px;font-size:var(--fs-mid);line-height:1.35;text-align:center;
  animation:fadein .2s ease both;
}

.bottombar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}

/* zoom controls – only shown while the board is scaled down */
.zoombar{
  display:flex;align-items:center;height:44px;
  background:#fff;border-radius:var(--r);box-shadow:var(--shadow);
}
.zoombar.hidden{visibility:hidden}
.zoombar button{width:46px;height:44px;display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease}
.zoombar button:active{transform:scale(.9)}
.zoombar .zsep{width:1px;height:22px;background:rgba(0,0,0,.15)}

/* winner / draw announcement */
.announce{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:14px;
  padding:clamp(14px,5.5vh,46px) 0 4px;animation:fadein .3s ease both}
.announce .party{display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.announce .emo-draw{font-size:84px;line-height:1;width:112px;text-align:center}
.announce .col{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
/* wraps rather than overflows — some translations are longer than "Wins by time" */
.announce .who{display:flex;align-items:center;gap:9px;font-size:var(--fs-std);font-weight:700;line-height:1.25}
.announce .who svg{flex:0 0 auto}

/* end-game pop-up */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20}
.dialog{
  background:#fff;border-radius:var(--r);box-shadow:var(--shadow);
  padding:20px 22px 16px;width:min(252px,calc(100% - 44px));text-align:center;
  animation:dialogin .18s ease both;
}
@keyframes dialogin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.dialog p{margin:0 0 16px;font-size:var(--fs-mid);line-height:1.35}
/* wraps instead of overflowing when a translation needs two long action words */
.dialog .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 30px}
.dialog .acts button{font-size:var(--fs-mid);font-weight:700}
.dialog .acts .cancel{color:var(--red)}

/* ============================================================
   SETTINGS / TUTORIAL / IMPRINT
   ============================================================ */
.subhead{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex:0 0 auto}
.subhead .title{flex:1;margin-right:82px}

.list{background:var(--surface-soft);border-radius:var(--r);overflow:hidden;
  flex:0 0 auto;margin-top:auto}
.list button{width:100%;display:flex;align-items:center;gap:14px;padding:15px 16px;
  font-size:var(--fs-mid);text-align:left;position:relative}
.list button + button::before{content:'';position:absolute;left:16px;right:16px;top:0;
  height:1px;background:rgba(0,0,0,.7)}
.list .sp{flex:1}

.tut h3{font-size:var(--fs-mid);font-weight:700;margin:26px 0 12px;flex:0 0 auto}
.tut h3:first-of-type{margin-top:2px}
.tut .card{padding:16px 18px;font-size:var(--fs-body);line-height:1.8;margin-bottom:14px;flex:0 0 auto}
.tut .card.last{margin-bottom:28px}
.tut .mini{display:flex;justify-content:center;margin-top:12px}
.tut .keyrow{display:flex;align-items:flex-start;gap:16px;padding:9px 0}
.tut .keyrow .k{flex:0 0 76px;display:flex;align-items:center;gap:8px}
.tut .keyrow .k.stackk{flex-direction:column;align-items:flex-start;gap:8px}
.tut .keyrow .k .clock{font-size:11px;padding:5px 9px}
.tut .keyrow .t{flex:1;font-size:var(--fs-body);line-height:1.7;padding-top:3px}

.imprint{background:var(--surface-soft);border-radius:var(--r);
  padding:16px 16px 24px;font-size:var(--fs-small);line-height:1.7;flex:0 0 auto}
.imprint h4{font-size:var(--fs-small);margin:16px 0 4px}
.imprint h4:first-child{margin-top:0}
.imprint p{margin:0 0 8px}

/* small grey credit line at the foot of the home screen */
.credits{
  flex:0 0 auto;margin:14px 0 0;text-align:center;
  font-size:11px;line-height:1.4;color:rgba(0,0,0,.38);
}
/* which build this device is actually running — handy after an update */
.imprint .build{margin-top:14px;opacity:.4;font-variant-numeric:tabular-nums}

/* ============================================================
   WIDE LAYOUT — tablet or laptop in landscape.
   Must match WIDE_MQ in app.js. A phone in landscape is wide but
   not tall, so it keeps the compact layout below.
   ============================================================ */
@media (min-width:900px) and (min-height:560px){
  /* --col: one width for every screen except the playing view
     --bar: the wider span the game screen's bars and board share */
  :root{--pad:clamp(30px,5vw,84px);--col:660px;--bar:1180px}

  body{background:#fff;align-items:stretch}
  #app{width:100vw;max-width:none;max-height:none;border-radius:0;box-shadow:none}
  .screen{padding:26px var(--pad) 28px}

  /* the bars, the board and the note all share one generous centred width, so
     they line up with each other and stop well short of the screen edge */
  .screen-game > .topbar,
  .screen-game > .bottombar,
  .screen-game > .board-area,
  .screen-game > .announce{width:min(100%,var(--bar));margin-left:auto;margin-right:auto}
  /* vertical room is the scarce one on a laptop, so the safe gap above and below
     the board is smaller than the generous margin at the sides */
  .board-area{margin-top:clamp(22px,3.5vh,46px);margin-bottom:clamp(22px,3.5vh,46px)}
  .notice{left:50%;right:auto;transform:translateX(-50%);
          width:min(calc(100% - 2*var(--pad)),var(--bar))}

  .topbar{flex:0 0 62px;height:62px;padding:0 22px;border-radius:20px}
  .topbar .iconbtn.flat{width:44px;height:44px;border-radius:12px}
  .clock{font-size:19px;padding:10px 18px}
  .bottombar{padding-top:0;gap:18px}
  .bottombar .iconbtn{width:82px;height:52px}
  .zoombar{height:52px}
  .zoombar button{width:54px;height:52px}

  /* every screen except the playing view shares one column width, and each
     block fills it — `width:100%` matters, because auto margins alone stop a
     flex item from stretching and short cards would end up narrower */
  .screen-home > *,
  .screen.scroll > *{width:100%;max-width:var(--col);margin-left:auto;margin-right:auto}

  /* cards use the full column, labels left, controls right, clear of the edge */
  .settings-card{padding:22px 30px;gap:18px}
  .imprint{padding:26px 30px 30px}
  .tut .card{padding:20px 26px}
  .wip{width:100%;max-width:var(--col)}

  /* back button at the left edge of the column, title centred in the column —
     the right margin mirrors the button so the text lands in the middle */
  .subhead{margin-bottom:28px}

  /* the Tutorial / Imprint list spans the column, but its text and chevron stay
     roughly where they were instead of being flung to the corners */
  .list button{padding-left:max(18px,calc(50% - 200px));padding-right:max(18px,calc(50% - 200px))}

  .announce{padding:22px 0 6px;gap:20px}
  .dialog{width:min(300px,calc(100% - 44px));padding:24px 26px 20px}
}

/* tablets held upright: a slightly wider column than a phone */
@media (min-width:600px) and (max-width:899px){
  #app{width:min(100vw,520px)}
}

/* ============================================================
   Very narrow phones — scale down a notch so every setting row
   stays on one line. Must stay last: it overrides the rules above.
   ============================================================ */
@media (max-width:359px){
  :root{--fs-std:17px;--fs-mid:15px;--pad:18px}
  .settings-card{padding:16px}
  .chip{min-width:70px;padding:7px 12px}
  .selchip{padding:7px 10px 7px 12px}
  .numchip .unit,.selchip .unit{font-size:13px}
  .row{gap:8px}
  .piece{width:42px}
  .pieces{gap:6px}
  .play-stack .btn-play{min-width:158px;padding:11px 22px}
}

/* ============================================================
   Short screens (phone in landscape) — the home screen has to fit
   a brand block, a button and a three-row card into ~375 px.
   ============================================================ */
@media (max-height:560px){
  .logo-img{width:60px;height:60px;margin-bottom:0}
  .wordmark-img.big{height:22px}
  .home-brand{margin-top:-2px}
  .home-top .iconbtn{height:38px}
  .settings-card{padding:14px 20px;gap:12px}
  .screen-home{overflow-y:auto}
  .announce{padding:10px 0 2px}
  .announce .party,.party-img{width:82px;height:82px}
  .announce .emo-draw{font-size:62px;width:82px}
}

</style>
</head>
<body>
  <div id="app"></div>
  <script>window.ExtendOX = { build: '5.1' };</script>
  <script>
/* =============================================================================
   ExtendOX — translations.
   Every user-visible string lives here. Values are either plain strings or
   functions of the values that need interpolating.

  <script>
/* =============================================================================
   ExtendOX — the engine behind the "Difficult" bot (4 in a row).

   A proof-number search (df-pn) over the real rules: growing board, owed
   extensions, board caps, the off-centre opening. It is the same prover that
   solved the game offline (see README §1, "How the Difficult bot decides"):
     · whoever opens on the middle of an edge can always force a win,
     · a corner opening loses to a reply in the centre,
   so the bot does not follow a script. On every turn it proves, move by move,
   that it can still win; when it cannot, it defends as stubbornly as the
   position allows and pounces on the first mistake.

   Runs in a Web Worker when the browser allows one (built from this very
   function, so the one-file build still works), otherwise on the page.
   ========================================================================== */
'use strict';

function ExtendOXEngine() {
  const DR = [0, 1, 1, 1], DC = [1, 0, 1, -1];
  const INF = 0x3FFFFFFF;
  const ABORT = { abort: true };
  const VCF_BUDGET = 2000;     // nodes for one "chain of threats" search
  const now = () => performance.now();

  /* rules of the game being played */
  let K = 4, CAPR = 10, CAPC = 10, CENTRE = true, SYM = 8, cfgId = '';

  /* ------------------------------------------------------------- positions
     { R, C, g: Uint8Array (0 empty, 1 = O, 2 = X), turn: 1|2, moves,
       pR / pC: the player to act owes a row / a column, drawn }            */
  const mk = (R, C, g, turn, moves, pR, pC, drawn) => ({ R, C, g, turn, moves, pR, pC, drawn });

  function run(s, r, c, dr, dc, p) {
    let n = 0; r += dr; c += dc;
    while (r >= 0 && r < s.R && c >= 0 && c < s.C && s.g[r * s.C + c] === p) { n++; r += dr; c += dc; }
    return n;
  }
  function winsAt(s, r, c, p) {
    for (let d = 0; d < 4; d++)
      if (1 + run(s, r, c, DR[d], DC[d], p) + run(s, r, c, -DR[d], -DC[d], p) >= K) return true;
    return false;
  }
  /* empty cells where p would win at once: 0, 1 or 2 (= two or more); the
     first one found is left in tCell */
  let tCell = -1;
  function threats(s, p) {
    let n = 0; tCell = -1;
    const g = s.g, C = s.C;
    for (let i = 0; i < g.length; i++) {
      if (g[i] !== 0) continue;
      const r = (i / C) | 0;
      if (winsAt(s, r, i - r * C, p)) { if (n === 0) tCell = i; if (++n >= 2) return 2; }
    }
    return n;
  }
  /* the mark of the player to act goes on cell i (never a winning cell — wins
     are caught before any move is generated) */
  function place(s, i) {
    const g = s.g.slice(); g[i] = s.turn;
    const R = s.R, C = s.C, r = (i / C) | 0, c = i - r * C;
    let colFull = true, rowFull = true;
    for (let a = 0; a < R; a++) if (g[a * C + c] === 0) { colFull = false; break; }
    for (let b = 0; b < C; b++) if (g[r * C + b] === 0) { rowFull = false; break; }
    const pR = colFull && R < CAPR, pC = rowFull && C < CAPC;
    let turn = s.turn, drawn = false;
    if (!pR && !pC) { if (g.indexOf(0) < 0) drawn = true; else turn = 3 - turn; }
    return mk(R, C, g, turn, s.moves + 1, pR, pC, drawn);
  }
  /* rs: -1 no row, 0 on top, 1 at the bottom · cs: -1 no column, 0 left, 1 right */
  function extend(s, rs, cs) {
    const R = s.R + (rs >= 0 ? 1 : 0), C = s.C + (cs >= 0 ? 1 : 0);
    const ro = rs === 0 ? 1 : 0, co = cs === 0 ? 1 : 0, g = new Uint8Array(R * C);
    for (let i = 0; i < s.R; i++) for (let j = 0; j < s.C; j++) g[(i + ro) * C + j + co] = s.g[i * s.C + j];
    return mk(R, C, g, 3 - s.turn, s.moves, false, false, false);
  }
  function extOptions(s) {
    const o = [];
    for (const rs of (s.pR ? [0, 1] : [-1])) for (const cs of (s.pC ? [0, 1] : [-1])) o.push([rs, cs]);
    return o;
  }
  const centreOf = s => (s.moves === 0 && CENTRE && s.R === 3 && s.C === 3) ? 4 : -1;

  /* ------------------------------------------ win-in-three, chains of fours
     How many different winning cells p gains by filling m (p had none). */
  function newWins(s, m, p) {
    const R = s.R, C = s.C, r0 = (m / C) | 0, c0 = m - r0 * C;
    let first = -1;
    for (let d = 0; d < 4; d++) {
      const dr = DR[d], dc = DC[d];
      for (let o = -(K - 1); o <= 0; o++) {
        const sr = r0 + o * dr, sc = c0 + o * dc, er = sr + (K - 1) * dr, ec = sc + (K - 1) * dc;
        if (sr < 0 || sr >= R || sc < 0 || sc >= C || er < 0 || er >= R || ec < 0 || ec >= C) continue;
        let hole = -1, bad = false;
        for (let k = 0; k < K; k++) {
          const i = (sr + k * dr) * C + sc + k * dc;
          if (i === m) continue;
          const v = s.g[i];
          if (v === p) continue;
          if (v !== 0 || hole >= 0) { bad = true; break; }
          hole = i;
        }
        if (bad || hole < 0) continue;
        if (first < 0) first = hole; else if (hole !== first) return 2;
      }
    }
    return first < 0 ? 0 : 1;
  }
  /* after playing m (and the best owed extension) the opponent has no win */
  function safeAfter(s, m) {
    const t = place(s, m);
    if (t.drawn) return false;
    if (!(t.pR || t.pC)) return true;
    const op = 3 - s.turn;
    for (const [rs, cs] of extOptions(t)) if (threats(extend(t, rs, cs), op) === 0) return true;
    return false;
  }
  /* a mark that leaves two winning cells at once; forced = the opponent's one
     winning cell (then that is the only candidate), or -1 */
  function w3Cell(s, forced) {
    const me = s.turn;
    if (forced >= 0) return newWins(s, forced, me) >= 2 && safeAfter(s, forced) ? forced : -1;
    const g = s.g;
    for (let i = 0; i < g.length; i++) if (g[i] === 0 && newWins(s, i, me) >= 2 && safeAfter(s, i)) return i;
    return -1;
  }
  /* victory by continuous fours: keep threatening to complete a line (each
     time the opponent must block, every extension choice of theirs is tried)
     until two winning cells appear at once. Returns the first mark, or -1. */
  let vcfLeft = 0;
  function vcfMove(s) { vcfLeft = VCF_BUDGET; return vcf(s, 16); }
  function vcf(s, depth) {
    if (--vcfLeft < 0) return -1;
    const me = s.turn, op = 3 - me;
    if (threats(s, me) > 0) return tCell;
    const n = threats(s, op);
    if (n >= 2) return -1;
    const forced = n === 1 ? tCell : -1;
    const w3 = w3Cell(s, forced);
    if (w3 >= 0) return w3;
    if (depth === 0) return -1;
    const g = s.g;
    for (let m = 0; m < g.length; m++) {
      if (forced >= 0 && m !== forced) continue;
      if (g[m] !== 0 || newWins(s, m, me) === 0) continue;
      const t = place(s, m);
      if (t.drawn) continue;
      for (const o of (t.pR || t.pC) ? extOptions(t) : [null]) {
        const u = o ? extend(t, o[0], o[1]) : t;
        if (threats(u, op) > 0) continue;                 // they would simply win
        const wn = threats(u, me);
        if (wn === 0) continue;
        if (wn >= 2) return m;
        const v = place(u, tCell);                        // their forced block
        if (v.drawn) continue;
        let all = true;
        for (const o2 of (v.pR || v.pC) ? extOptions(v) : [null]) {
          if (vcf(o2 ? extend(v, o2[0], o2[1]) : v, depth - 1) < 0) { all = false; break; }
        }
        if (all) return m;
        if (vcfLeft < 0) return -1;
      }
    }
    return -1;
  }

  /* ----------------------------------------------- position keys (symmetry)
     The 8 reflections/rotations give the same game, except that a transpose
     swaps rows and columns — only allowed when both caps are equal. */
  const maps = new Map();
  function symMaps(R, C) {
    const id = R * 4096 + C;
    let m = maps.get(id);
    if (m) return m;
    m = [];
    for (let t = 0; t < 8; t++) {
      const tr = t >= 4, R2 = tr ? C : R, C2 = tr ? R : C, a = new Int32Array(R * C);
      let k = 0;
      for (let i = 0; i < R2; i++) for (let j = 0; j < C2; j++) {
        let r, c;
        switch (t) {
          case 0: r = i; c = j; break;
          case 1: r = i; c = C - 1 - j; break;
          case 2: r = R - 1 - i; c = j; break;
          case 3: r = R - 1 - i; c = C - 1 - j; break;
          case 4: r = j; c = i; break;
          case 5: r = R - 1 - j; c = i; break;
          case 6: r = j; c = C - 1 - i; break;
          default: r = R - 1 - j; c = C - 1 - i;
        }
        a[k++] = r * C + c;
      }
      m.push(a);
    }
    maps.set(id, m);
    return m;
  }
  const fmix = h => {
    h ^= h >>> 16; h = Math.imul(h, 0x85EBCA6B); h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16;
    return h >>> 0;
  };
  let K1 = 0, K2 = 0;
  function key(s) {
    const m = symMaps(s.R, s.C), g = s.g, n = g.length, f = s.moves === 0 ? 1 : 0;
    let b1 = 0, b2 = 0, have = false;
    for (let t = 0; t < SYM; t++) {
      const tr = t >= 4, R2 = tr ? s.C : s.R, C2 = tr ? s.R : s.C;
      const pr = (tr ? s.pC : s.pR) ? 1 : 0, pc = (tr ? s.pR : s.pC) ? 1 : 0;
      const head = R2 | (C2 << 8) | (s.turn << 16) | (pr << 18) | (pc << 19) | (f << 20);
      let h1 = Math.imul(0x811C9DC5 ^ head, 0x01000193), h2 = Math.imul(0x9E3779B9 ^ head, 0x5BD1E995);
      const a = m[t];
      for (let k = 0; k < n; k++) {
        const v = g[a[k]];
        h1 = Math.imul(h1 ^ v, 0x01000193);
        h2 = Math.imul(h2 ^ (v + 0x2F), 0x5BD1E995); h2 ^= h2 >>> 15;
      }
      h1 = fmix(h1); h2 = fmix(h2 ^ 0x27D4EB2F);
      if (!have || h1 < b1 || (h1 === b1 && h2 < b2)) { b1 = h1; b2 = h2; have = true; }
    }
    K1 = b1; K2 = b2;
  }

  /* ----------------------------------------------- transposition tables
     One per player: the numbers mean "can this player force a win".      */
  function newTT(bits) {
    const n = 1 << bits;
    return { m: n - 1, k1: new Uint32Array(n), k2: new Uint32Array(n), pn: new Uint32Array(n), dn: new Uint32Array(n) };
  }
  const TTS = [null, newTT(20), newTT(20)];
  let X = 1, T = TTS[1];
  const setX = p => { X = p; T = TTS[p]; };
  let LP = 1, LD = 1;
  function lookup(k1, k2) {
    const b = (k1 & T.m) & ~3;
    for (let i = b; i < b + 4; i++)
      if (T.k1[i] === k1 && T.k2[i] === k2 && (T.pn[i] | T.dn[i]) !== 0) { LP = T.pn[i]; LD = T.dn[i]; return true; }
    LP = 1; LD = 1; return false;
  }
  function store(k1, k2, pn, dn) {
    const b = (k1 & T.m) & ~3;
    let victim = -1, worst = Infinity;
    for (let i = b; i < b + 4; i++) {
      if (T.k1[i] === k1 && T.k2[i] === k2) { victim = i; break; }
      if ((T.pn[i] | T.dn[i]) === 0) { victim = i; worst = 0; continue; }
      const solved = T.pn[i] === 0 || T.dn[i] === 0;
      const value = solved ? Number.MAX_SAFE_INTEGER : T.pn[i] + T.dn[i];
      if (worst !== 0 && value < worst) { worst = value; victim = i; }
    }
    T.k1[victim] = k1; T.k2[victim] = k2; T.pn[victim] = pn; T.dn[victim] = dn;
  }
  function configure(c) {
    const id = [c.K, c.capR, c.capC, c.centre].join('|');
    if (id === cfgId) return;
    cfgId = id;
    K = c.K; CAPR = c.capR; CAPC = c.capC; CENTRE = !!c.centre;
    SYM = CAPR === CAPC ? 8 : 4;
    // the rules changed, so every stored result is void
    for (let p = 1; p <= 2; p++) { const t = TTS[p]; t.k1.fill(0); t.k2.fill(0); t.pn.fill(0); t.dn.fill(0); }
  }

  /* ----------------------------------------------------------- the search */
  /* +1 X has won / wins in three, -1 X cannot win here, 0 open.
     FORCED = the only sensible reply (blocking the single winning cell), or -1 */
  let FORCED = -1;
  function terminal(s) {
    FORCED = -1;
    if (s.drawn) return -1;
    if (s.pR || s.pC) return 0;
    const me = s.turn, op = 3 - me, win = me === X ? 1 : -1;
    if (threats(s, me) > 0) return win;
    const n = threats(s, op);
    if (n >= 2) return -win;
    const forced = n === 1 ? tCell : -1;
    FORCED = forced;
    if (w3Cell(s, forced) >= 0) return win;
    return 0;
  }
  function children(s, forced) {
    if (s.pR || s.pC) return extOptions(s).map(([rs, cs]) => extend(s, rs, cs));
    if (forced >= 0) return [place(s, forced)];
    const centre = centreOf(s), g = s.g, out = [];
    for (let i = 0; i < g.length; i++) if (g[i] === 0 && i !== centre) out.push(place(s, i));
    return out;
  }
  function init(s, k1, k2) {
    if (lookup(k1, k2)) return;
    const t = terminal(s);
    if (t === 1) { LP = 0; LD = INF; store(k1, k2, 0, INF); return; }
    if (t === -1) { LP = INF; LD = 0; store(k1, k2, INF, 0); return; }
    let mob;
    if (s.pR || s.pC) mob = (s.pR ? 2 : 1) * (s.pC ? 2 : 1);
    else if (FORCED >= 0) mob = 1;
    else { mob = 0; const g = s.g; for (let i = 0; i < g.length; i++) if (g[i] === 0) mob++; }
    if (s.turn === X) { LP = 1; LD = mob; } else { LP = mob; LD = 1; }
  }

  let nodes = 0, deadline = Infinity, RP = 0, RD = 0;
  function mid(n, k1, k2, thpn, thdn) {
    if ((++nodes & 255) === 0 && now() > deadline) throw ABORT;
    let term = terminal(n);
    const forced = FORCED;
    // first visit of a placing node: look for a chain of fours, for either side
    if (term === 0 && !(n.pR || n.pC) && !lookup(k1, k2) && vcfMove(n) >= 0) term = n.turn === X ? 1 : -1;
    if (term !== 0) { RP = term === 1 ? 0 : INF; RD = term === 1 ? INF : 0; store(k1, k2, RP, RD); return; }

    const ch = children(n, forced), m = ch.length;
    const ck1 = new Uint32Array(m), ck2 = new Uint32Array(m), lp = new Uint32Array(m), ld = new Uint32Array(m);
    for (let i = 0; i < m; i++) { key(ch[i]); ck1[i] = K1; ck2[i] = K2; }
    for (let i = 0; i < m; i++) { init(ch[i], ck1[i], ck2[i]); lp[i] = LP; ld[i] = LD; }
    const orNode = n.turn === X;
    for (;;) {
      let pn, dn, best = -1, b1 = INF + 1, b2 = INF + 1, other = 0;

/* translation lookup — falls back to English for anything missing */
function t(key, ...args) {
  const v = (T[S.lang] || T.en)[key] ?? T.en[key];
  return typeof v === 'function' ? v(...args) : v;
}

const winLen = () => MODES[S.mode].win;

/* the Difficult bot exists for 4 in a row only — that is the game it has solved */
const hardOffered = () => winLen() === 4;

function newGame(bot, level) {
  const secs = S.minutes * 60;
  return {
    winLen: winLen(),       // frozen for the whole match
    bot: !!bot,             // playing against the bot — no clock in that mode
    // 'easy' = the rule-based bot, 'hard' = the perfect-play engine (engine.js)
    level: bot ? (level === 'hard' && hardOffered() ? 'hard' : 'easy') : null,
    human: bot ? S.humanPiece : null,
    botP:  bot ? other(S.humanPiece) : null,
    rows: 3, cols: 3,
    grid: [[null, null, null], [null, null, null], [null, null, null]],
    // whichever mark is picked as the opener goes first, in both modes
    turn: S.startPiece,
    pendRow: false,         // owes the board one extra ROW    (a column filled up)
    pendCol: false,         // owes the board one extra COLUMN (a row filled up)
    moveNo: 0,
    over: false, winner: null, reason: null, winLine: null,
    clock: { O: secs, X: secs },
    history: [],
    notice: null, noticeAt: 0,
  };
}

const other   = who => (who === 'X' ? 'O' : 'X');
const colorOf = who => (who === 'X' ? RED : BLUE);
const clamp   = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

/* ------------------------------- game rules -------------------------------- */
const snapshot = g => JSON.stringify({
  rows: g.rows, cols: g.cols, grid: g.grid, turn: g.turn,
  pendRow: g.pendRow, pendCol: g.pendCol, moveNo: g.moveNo,
  over: g.over, winner: g.winner, reason: g.reason, winLine: g.winLine,
});

function canPlace(g, r, c) {
  if (g.bot && g.turn !== g.human) return false;    // the bot's turn — hands off
  return !g.over && !g.pendRow && !g.pendCol && !S.dialog && !g.grid[r][c];
}

/* longest run of identical marks through (r,c); null when shorter than g.winLen */
function findWin(g, r, c) {
  const who = g.grid[r][c];
  for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const line = [[r, c]];
    for (const step of [1, -1]) {
      let rr = r + dr * step, cc = c + dc * step;
      while (rr >= 0 && rr < g.rows && cc >= 0 && cc < g.cols && g.grid[rr][cc] === who) {
        step === 1 ? line.push([rr, cc]) : line.unshift([rr, cc]);
        rr += dr * step; cc += dc * step;
      }
    }
    if (line.length >= (g.winLen || 4)) return line;
  }
  return null;
}

const boardFull = g => g.grid.every(row => row.every(Boolean));

function place(r, c) {
  const g = S.game;
  // the bot bypasses canPlace's turn lock, but obeys every other rule
  const mine = g.bot && g.turn === g.botP;

  if (mine && (g.over || g.pendRow || g.pendCol || g.grid[r][c])) return;

  // "To ensure fairness, the first mark cannot be placed in the middle of the grid!"
  if (S.blockCentre && g.moveNo === 0 && r === 1 && c === 1) {
    setNotice(g, t('centreNotice'));
    return render();
  }

  g.history.push(snapshot(g));
  g.grid[r][c] = g.turn;
  g.moveNo++;
  S.lastPlaced = [r, c];
  g.notice = null;
  resetView();

  const line = findWin(g, r, c);
  if (line) { endGame(g, g.turn, 'line', line); return render(); }

  // a filled COLUMN owes the board a new row, a filled ROW owes it a new column
  let colFull = true; for (let i = 0; i < g.rows; i++) if (!g.grid[i][c]) { colFull = false; break; }
  let rowFull = true; for (let j = 0; j < g.cols; j++) if (!g.grid[r][j]) { rowFull = false; break; }

  const L = limits(), blocked = [];
  if (colFull) { g.rows < L.maxRows ? g.pendRow = true : blocked.push('row'); }
  if (rowFull) { g.cols < L.maxCols ? g.pendCol = true : blocked.push('col'); }
  if (blocked.length) {
    const what = blocked.length === 2 ? t('limBoth') : t(blocked[0] === 'row' ? 'limRow' : 'limCol');
    setNotice(g, t('limitNotice', S[kMaxW()], S[kMaxH()], what));
  }

  if (!g.pendRow && !g.pendCol) finishTurn(g);
  render();
}

/* grows the board by one row / column — no turn logic, so the bot can use it
   on a throw-away copy to look one step ahead */
function growBoard(g, side) {
  if (side === 'top' || side === 'bottom') {
    const fresh = new Array(g.cols).fill(null);
    side === 'top' ? g.grid.unshift(fresh) : g.grid.push(fresh);
    g.rows++;
  } else {
    g.grid.forEach(row => side === 'left' ? row.unshift(null) : row.push(null));
    g.cols++;
  }
}

function extend(side) {
  const g = S.game;
  if (g.over) return;
  const isRow = side === 'top' || side === 'bottom';
  if (isRow ? !g.pendRow : !g.pendCol) return;

  g.history.push(snapshot(g));
  resetView();
  growBoard(g, side);
  if (isRow) g.pendRow = false; else g.pendCol = false;
  if (!g.pendRow && !g.pendCol) finishTurn(g);
  render();
}

function finishTurn(g) {
  // stalemate: the board is completely full and cannot grow any further
  if (boardFull(g)) return endGame(g, null, 'draw', null);
  g.turn = other(g.turn);
}

function endGame(g, winner, reason, line) {
  g.over = true; g.winner = winner; g.reason = reason; g.winLine = line;
  g.pendRow = g.pendCol = false; g.notice = null;
}

function setNotice(g, text) {
  g.notice = text; g.noticeAt = Date.now();
  const at = g.noticeAt;
  setTimeout(() => { if (S.game === g && g.noticeAt === at) { g.notice = null; render(); } }, 4600);
}

/* Undo steps back one action – a placement or an extension choice.
   Clocks are deliberately not rewound: time spent stays spent. */
function undo() {
  const g = S.game;
  if (!g.history.length) return;
  cancelBot();
  Object.assign(g, JSON.parse(g.history.pop()));
  // against the bot, step all the way back to the start of your own turn —
  // undoing only the bot's half of a turn would just make it move again
  if (g.bot) {
    while (g.history.length && (g.over || g.pendRow || g.pendCol || g.turn !== g.human)) {
      Object.assign(g, JSON.parse(g.history.pop()));
    }
  }
  S.lastPlaced = null; g.notice = null;
  resetView();
  render();
}

/* ============================ bot (Easy level) =============================
   Placement, in this order:
     1  never the centre on move 1 while that rule is on
     2  win now if a mark completes a line
     3  block when the player is one mark from winning (with a double threat
        only one can be blocked — that is unavoidable, so block the one that
        also helps the bot most)
     4  otherwise extend the bot's own longest still-open line, random on ties

   Extension side:
     1  never a side that hands the player an immediate win
     2  prefer a side that gives the bot two winning cells at once, which the
        player cannot both block
     3  otherwise random
   ========================================================================== */
const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
const BOT_MOVE_MS   = 480;    // pause before the bot places a mark
const BOT_EXTEND_MS = 1000;   // the grey bars stay visible this long first

const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];
const boardCopy = g => ({ rows: g.rows, cols: g.cols, grid: g.grid.map(r => r.slice()), winLen: g.winLen });
const inBoard = (g, r, c) => r >= 0 && r < g.rows && c >= 0 && c < g.cols;

/* an end that runs off the board only counts as blocked once the board itself
   can no longer grow that way */
function offBoardOpen(g, r, c) {
  const L = limits();
  if ((r < 0 || r >= g.rows) && g.rows >= L.maxRows) return false;
  if ((c < 0 || c >= g.cols) && g.cols >= L.maxCols) return false;
  return true;
}

/* longest run through (r,c) for `who`, ignoring runs that are already dead.
   Call with the mark already written into g.grid. */
function runThrough(g, r, c, who) {
  let best = 0;
  for (const [dr, dc] of DIRS) {
    let run = 1;
    const ends = [];
    for (const s of [1, -1]) {
      let rr = r + dr * s, cc = c + dc * s;
      while (inBoard(g, rr, cc) && g.grid[rr][cc] === who) { run++; rr += dr * s; cc += dc * s; }
      ends.push([rr, cc]);
    }
    if (run >= g.winLen) return { run, win: true };
    const dead = ends.every(([rr, cc]) => inBoard(g, rr, cc)
      ? (g.grid[rr][cc] && g.grid[rr][cc] !== who)
      : !offBoardOpen(g, rr, cc));
    if (!dead) best = Math.max(best, run);
  }
  return { run: best, win: false };
}

/* what a mark at (r,c) would be worth to `who` */
function tryCell(g, r, c, who) {
  g.grid[r][c] = who;
  const v = runThrough(g, r, c, who);
  g.grid[r][c] = null;
  return v;
}

function emptyCells(g, skipCentre) {
  const out = [];
  for (let r = 0; r < g.rows; r++) for (let c = 0; c < g.cols; c++) {
    if (g.grid[r][c]) continue;
    if (skipCentre && r === 1 && c === 1) continue;
    out.push([r, c]);
  }
  return out;
}

const bestBy = (list, score) => {
  let top = -Infinity, keep = [];
  for (const item of list) {
    const s = score(item);
    if (s > top) { top = s; keep = [item]; } else if (s === top) keep.push(item);
  }
  return pickOne(keep);
};

function botChooseMove(g) {
  const me = g.botP, you = g.human;
  let cells = emptyCells(g, S.blockCentre && g.moveNo === 0);
  if (!cells.length) cells = emptyCells(g, false);      // nothing else legal
  if (!cells.length) return null;

  const winning = cells.filter(([r, c]) => tryCell(g, r, c, me).win);
  if (winning.length) return pickOne(winning);

  const threats = cells.filter(([r, c]) => tryCell(g, r, c, you).win);
  if (threats.length) return bestBy(threats, ([r, c]) => tryCell(g, r, c, me).run);

  return bestBy(cells, ([r, c]) => tryCell(g, r, c, me).run);
}

function botChooseSide(g, isRow) {
  const sides = isRow ? ['top', 'bottom'] : ['left', 'right'];
  const looks = sides.map(side => {
    const t = boardCopy(g);
    growBoard(t, side);
    let playerCanWin = false, myWinCells = 0;
    for (const [r, c] of emptyCells(t, false)) {
      if (!playerCanWin && tryCell(t, r, c, g.human).win) playerCanWin = true;
      if (tryCell(t, r, c, g.botP).win) myWinCells++;
      if (playerCanWin && myWinCells >= 2) break;
    }
    return { side, playerCanWin, fork: myWinCells >= 2 };
  });

  let allowed = looks.filter(l => !l.playerCanWin);
  if (!allowed.length) allowed = looks;                 // has to extend regardless
  const forks = allowed.filter(l => l.fork);
  return pickOne(forks.length ? forks : allowed).side;
}

/* ---- driver: one step per timer tick so the player can follow along ------ */
let botTimer = 0, botToken = 0, botArmedAt = 0;
const botThinking = () => botTimer !== 0;

function cancelBot() { clearTimeout(botTimer); botTimer = 0; botToken++; }

const botsTurn = g => g && g.bot && !g.over && g.turn === g.botP;
const botIdle = () => botsTurn(S.game) && S.screen === 'game' && !S.dialog;
/* the Difficult bot may think for several seconds — the watchdog must not
   mistake that for a stalled timer */
const botStallMs = () => (S.game && S.game.level === 'hard' ? 25000 : 4000);

function maybeBotTurn() {
  const g = S.game;
  if (!botIdle() || botTimer) return;
  const token = botToken;
  const owes = g.pendRow || g.pendCol;
  botArmedAt = Date.now();
  if (g.level === 'hard') return hardBotTurn(token, owes ? BOT_EXTEND_MS : BOT_MOVE_MS);
  botTimer = setTimeout(() => {
    botTimer = 0;
    const gg = S.game;
    if (token !== botToken || !botsTurn(gg) || S.screen !== 'game' || S.dialog) return;
    easyBotStep(gg);
  }, owes ? BOT_EXTEND_MS : BOT_MOVE_MS);
}

function easyBotStep(g) {
  if (g.pendRow || g.pendCol) extend(botChooseSide(g, g.pendRow));
  else {
    const m = botChooseMove(g);
    if (m) place(m[0], m[1]);
  }
}

/* ---- the Difficult bot (4 in a row): the proof-number engine in engine.js --
   It is asked for every single step — a mark, or the side of an owed
   extension — and its answer is played once the usual pause is over too, so
   it looks and feels like the Easy bot, just stronger. While you think, the
   engine keeps working on the position (pondering), so most answers are
   instant. If the engine ever fails, the Easy rules stand in for that step. */

/* the position as the engine sees it: 1 = O, 2 = X */
function enginePos(g) {
  const L = limits(), cells = [];
  for (const row of g.grid) for (const v of row) cells.push(v === 'O' ? 1 : v === 'X' ? 2 : 0);
  return {
    R: g.rows, C: g.cols, cells, turn: g.turn === 'O' ? 1 : 2, moves: g.moveNo,
    pR: g.pendRow, pC: g.pendCol,
    cfg: { K: g.winLen, capR: L.maxRows, capC: L.maxCols, centre: S.blockCentre },
  };
}

function hardBotTurn(token, pause) {
  let move, answered = false, paused = false;
  const act = () => {
    if (!answered || !paused) return;
    botTimer = 0;
    const g = S.game;
    if (token !== botToken || !botsTurn(g) || S.screen !== 'game' || S.dialog) return;
    if (move && move.ext) {
      const [rs, cs] = move.ext;
      if (rs >= 0 && g.pendRow) return extend(rs === 0 ? 'top' : 'bottom');
      if (cs >= 0 && g.pendCol) return extend(cs === 0 ? 'left' : 'right');
    } else if (move && move.cell >= 0 && !(g.pendRow || g.pendCol)) {
      const r = Math.floor(move.cell / g.cols), c = move.cell % g.cols;
      if (r < g.rows && !g.grid[r][c]) return place(r, c);
    }
    easyBotStep(g);
  };
  botTimer = setTimeout(() => { paused = true; act(); }, pause);
  BotEngine.decide(enginePos(S.game), m => {
    if (token !== botToken) return;
    move = m; answered = true; act();
  });
}

/* on your turn in a Difficult game the engine works ahead on the position */
let pondered = '';
function maybePonder() {
  const g = S.game;
  if (!g || g.level !== 'hard' || g.over || g.turn !== g.human || S.screen !== 'game') {
    if (pondered) { BotEngine.stopPonder(); pondered = ''; }
    return;
  }
  const pos = enginePos(g), id = JSON.stringify(pos);
  if (id === pondered) return;
  pondered = id;
  BotEngine.ponder(pos, g.botP === 'O' ? 1 : 2);
}

/* --------------------------------- clocks ---------------------------------- */
let clockRef = Date.now();
setInterval(() => {
  const g = S.game;
  const now = Date.now();

  // Watchdog: the bot is normally armed by render(). If a step is ever missed —
  // a cancelled timer with no render behind it, a tab that was frozen — re-arm
  // it here so a bot game can never sit there waiting forever.
  if (botIdle() && (!botTimer || now - botArmedAt > botStallMs())) { cancelBot(); maybeBotTurn(); }

  // no clock in a bot game
  const running = g && S.timeLimit && !g.bot && !g.over && S.screen === 'game' && !S.dialog;
  if (!running) { clockRef = now; return; }
  const before = Math.ceil(g.clock[g.turn]);
  g.clock[g.turn] = Math.max(0, g.clock[g.turn] - (now - clockRef) / 1000);
  clockRef = now;
  if (g.clock[g.turn] <= 0) { endGame(g, other(g.turn), 'time', null); render(); }
  else if (Math.ceil(g.clock[g.turn]) !== before) paintClocks();
}, 200);

const mmss = s => {
  s = Math.max(0, Math.ceil(s));
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
};

function paintClocks() {
  const g = S.game; if (!g) return;
  ['O', 'X'].forEach(who => {
    const el = document.querySelector(`[data-clock="${who}"]`);
    if (!el) return;
    el.textContent = mmss(g.clock[who]);
    el.classList.toggle('active', !g.over && g.turn === who);
    el.classList.toggle('dead', g.clock[who] <= 0);
  });
}

function render() {
  $app.innerHTML = ({
    home: viewHome, botsetup: viewBotSetup, game: viewGame, settings: viewSettings,
    tutorial: viewTutorial, imprint: viewImprint,
  })[S.screen]();
  if (S.screen === 'game') layoutBoard();
  placeModeMenu();
  maybeBotTurn();
  maybePonder();
}

/* Open a dropdown on whichever side has more room and cap its height so it can
   never run off the screen — the language list is seven rows tall. */
function placeModeMenu() {
  const m = document.querySelector('.selmenu');
  if (!m) return;
  m.classList.remove('up'); m.style.maxHeight = '';
  const chip = m.parentElement.querySelector('.selchip').getBoundingClientRect();
  const a = $app.getBoundingClientRect();
  const below = a.bottom - chip.bottom - 16;
  const above = chip.top - a.top - 16;
  const up = m.scrollHeight > below && above > below;
  m.classList.toggle('up', up);
  m.style.maxHeight = Math.max(110, Math.floor(up ? above : below)) + 'px';
}

/* --------------------------------- game ----------------------------------- */
function indicator() {
  const g = S.game;
  const tint = (col, ic) => `<span class="tint" style="color:${col}">${ic}</span>`;
  if (g.over) {
    if (g.reason === 'draw') return `<span class="emo24">🤝</span>`;
    // nothing to celebrate when the bot took it
    if (g.bot && g.winner === g.botP) return `<span class="emo24">😔</span>`;
    return tint(colorOf(g.winner), IC.party(24));
  }
  const col = colorOf(g.turn);
  if (g.pendRow && g.pendCol) return tint(col, IC.extBoth(28));
  if (g.pendRow) return tint(col, IC.extRow(24));
  if (g.pendCol) return tint(col, IC.extCol(24));
  return smallMark(g.turn, 24);
}

function announcement() {
  const g = S.game;
  if (!g.over) return '';
  const draw = g.reason === 'draw';
  const botBeatYou = g.bot && !draw && g.winner === g.botP;

  let art, who;
  if (draw)            { art = '<span class="emo-draw">🤝</span>'; who = t('draw'); }
  else if (botBeatYou) { art = '<span class="emo-draw">😔</span>'; who = `<span>${t('botWins')}</span>`; }
  else                 { art = partyBig();
                         who = `${smallMark(g.winner, 24)}<span>${g.reason === 'time' ? t('winsByTime') : t('wins')}</span>`; }

  return `
  <div class="announce">
    <div class="party">${art}</div>
    <div class="col">
      <div class="who">${who}</div>
      <button class="btn-play${g.bot ? ' blue' : ''}" data-act="play" ${g.bot ? `data-bot="1" data-level="${g.level}"` : ''}>${t('playAgain')}</button>
    </div>
  </div>`;
}

        <p>${t('undoOffMsg')}</p>
        <div class="acts">
          <button data-act="go" data-to="settings">${t('goSettings')}</button>
          <button class="cancel" data-act="closeDialog">${t('close')}</button>
        </div>
      </div>
    </div>`;
  return '';
}

/* --------------------------- board sizing & view --------------------------- */
/* The board is always drawn at cellSize() and scaled with a CSS transform, so
   zooming and panning never need a re-render.
     view.k  = current scale (geo.kFit … 1)
     geo.kFit = the scale at which the whole board (plus the room reserved for
                the grey extension bars) fits into the board area              */
const view = { k: 0, px: 0, py: 0 };
/* fitW/fitH  – board + the space reserved for the grey bars (drives kFit)
   panW/panH  – what is actually painted right now (drives the pan limits)   */
let geo = { kFit: 1, areaW: 0, areaH: 0, fitW: 0, fitH: 0, panW: 0, panH: 0 };

const resetView = () => { view.k = 0; view.px = 0; view.py = 0; };
/* zoom & drag are only offered once the cells have become too small to tap
   comfortably — on a normal 3 × 3 board nothing changes. */
const zoomable  = () => geo.kFit * cellSize() < MIN_TOUCH;

function layoutBoard() {
  const area = document.getElementById('boardArea');
  if (!area) return;
  const g = S.game, L = limits();

  // Room for the two grey bars is reserved on every axis that can still grow,
  // so the board never resizes the moment they pop up.
  const grow  = !g.over;
  const spanC = g.cols + (grow && g.cols < L.maxCols ? 2 : 0);
  const spanR = g.rows + (grow && g.rows < L.maxRows ? 2 : 0);

  // The bottom note is anchored to the screen, so measure how much of the board
  // area it actually covers instead of guessing — its height varies with the
  // wording and the screen width.
  const note = document.querySelector('.notice');
  let slot = 0;
  if (note) slot = Math.max(0, area.getBoundingClientRect().bottom - (note.getBoundingClientRect().top - NOTICE_GAP));
  area.style.paddingBottom = slot ? slot + 'px' : '';

  geo.areaW = area.clientWidth;
  geo.areaH = area.clientHeight - slot;
  const CS = cellSize();
  geo.fitW = spanC * CS;
  geo.fitH = spanR * CS;
  geo.panW = (g.cols + (g.pendCol ? 2 : 0)) * CS;
  geo.panH = (g.rows + (g.pendRow ? 2 : 0)) * CS;
  geo.kFit = Math.min(1, (geo.areaW - 2) / geo.fitW, (geo.areaH - 2) / geo.fitH);

  if (!view.k || view.k < geo.kFit) { view.k = geo.kFit; view.px = view.py = 0; }
  view.k = clamp(view.k, geo.kFit, 1);

  area.innerHTML = boardHTML();
  area.classList.toggle('zoomable', zoomable());
  const zb = document.getElementById('zoomBar');
  if (zb) zb.classList.toggle('hidden', !zoomable());
  applyView();
  S.lastPlaced = null;   // the pop animation plays exactly once
}
addEventListener('resize', () => { if (S.screen === 'game') layoutBoard(); });

/* crossing between the compact and the wide layout changes the cell size, the
   board caps and which set of size numbers the settings show — redraw properly */
matchMedia(WIDE_MQ).addEventListener('change', () => { resetView(); render(); });

function clampPan() {
  const maxX = Math.max(0, (geo.panW * view.k - geo.areaW) / 2);
  const maxY = Math.max(0, (geo.panH * view.k - geo.areaH) / 2);
  view.px = clamp(view.px, -maxX, maxX);
  view.py = clamp(view.py, -maxY, maxY);
}

function applyView() {
  clampPan();
  const b = document.querySelector('.board');
  if (b) b.style.transform = `translate(${view.px}px, ${view.py}px) scale(${view.k})`;
}

/* zoom towards a point q (in board-area coordinates, relative to its centre) */
function zoomTo(k, qx = 0, qy = 0) {
  const k2 = clamp(k, geo.kFit, 1);
  if (k2 === view.k) return;
  const f = k2 / view.k;
  view.px = qx - (qx - view.px) * f;
  view.py = qy - (qy - view.py) * f;
  view.k = k2;
  applyView();
}

function boardHTML() {
  const g = S.game;
  const cell = cellSize();
  const lw = Math.round(cell * 0.0968), rad = Math.round(cell * 0.242);
  const W = g.cols * cell, H = g.rows * cell;
  const faded = g.over || S.dialog;

  let h = `<div class="board${faded ? ' faded' : ''}" style="width:${W}px;height:${H}px">`;

  for (let r = 0; r < g.rows; r++) for (let c = 0; c < g.cols; c++) {
    const v = g.grid[r][c];
    const live = !faded && canPlace(g, r, c);
    const pop = S.lastPlaced && S.lastPlaced[0] === r && S.lastPlaced[1] === c;
    h += `<div class="cell${live ? ' live' : ''}" ${live ? `data-act="place" data-r="${r}" data-c="${c}"` : ''}
            style="left:${c * cell}px;top:${r * cell}px;width:${cell}px;height:${cell}px"
          >${v ? mark(v, cell * .775, pop) : ''}</div>`;
  }
  h += gridLines(g.rows, g.cols, cell, lw, '#000');

  if (!faded) {
    // while the bot is choosing, the bars are shown but not tappable
    const live = !(g.bot && g.turn === g.botP);
    if (g.pendRow) h += strip('top', g.rows, g.cols, cell, lw, rad, live) + strip('bottom', g.rows, g.cols, cell, lw, rad, live);
    if (g.pendCol) h += strip('left', g.rows, g.cols, cell, lw, rad, live) + strip('right', g.rows, g.cols, cell, lw, rad, live);
  }

  if (g.over && g.winLine) {
    const [r0, c0] = g.winLine[0], [r1, c1] = g.winLine[g.winLine.length - 1];
    const x0 = (c0 + .5) * cell, y0 = (r0 + .5) * cell, x1 = (c1 + .5) * cell, y1 = (r1 + .5) * cell;
    const len = Math.hypot(x1 - x0, y1 - y0) || 1, ex = .42 * cell;
    const ux = (x1 - x0) / len * ex, uy = (y1 - y0) / len * ex;
    h += `<svg class="winline" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
            <line x1="${x0 - ux}" y1="${y0 - uy}" x2="${x1 + ux}" y2="${y1 + uy}"
              stroke="${colorOf(g.winner)}" stroke-opacity=".55"
              stroke-width="${cell * .075}" stroke-linecap="round"/></svg>`;
  }
  return h + '</div>';
}

function gridLines(rows, cols, cell, lw, color) {
  const W = cols * cell, H = rows * cell;
  let h = '';
  for (let i = 1; i < cols; i++)
    h += `<div class="gl" style="left:${i * cell - lw / 2}px;top:0;width:${lw}px;height:${H}px;background:${color}"></div>`;
  for (let j = 1; j < rows; j++)
    h += `<div class="gl" style="left:0;top:${j * cell - lw / 2}px;width:${W}px;height:${lw}px;background:${color}"></div>`;
  return h;
}

/* one translucent grey "new row / new column" bar hugging the board.
   The edge that touches the grid stays square; the outer corners are rounded. */
function strip(side, rows, cols, cell, lw, rad, interactive) {
  const W = cols * cell, H = rows * cell;
  const horizontal = side === 'top' || side === 'bottom';        // a new ROW
  const box = horizontal
    ? { l: 0, t: side === 'top' ? -cell : H, w: W, h: cell }
    : { l: side === 'left' ? -cell : W, t: 0, w: cell, h: H };
  const radius = {
    top:    `${rad}px ${rad}px 0 0`,
    bottom: `0 0 ${rad}px ${rad}px`,
    left:   `${rad}px 0 0 ${rad}px`,
    right:  `0 ${rad}px ${rad}px 0`,
  }[side];

  let inner = '';
  if (horizontal) {
    for (let i = 1; i < cols; i++)
      inner += `<div class="gsep" style="left:${i * cell - lw / 2}px;top:0;width:${lw}px;height:${cell}px"></div>`;
    inner += `<div class="gsep" style="left:0;${side === 'top' ? 'bottom' : 'top'}:0;width:${W}px;height:${lw}px"></div>`;
  } else {
    for (let j = 1; j < rows; j++)
      inner += `<div class="gsep" style="top:${j * cell - lw / 2}px;left:0;height:${lw}px;width:${cell}px"></div>`;
    inner += `<div class="gsep" style="top:0;${side === 'left' ? 'right' : 'left'}:0;height:${H}px;width:${lw}px"></div>`;
  }
  return `<div class="ghost" data-side="${side}" ${interactive ? `data-act="extend"` : ''}
      style="left:${box.l}px;top:${box.t}px;width:${box.w}px;height:${box.h}px;border-radius:${radius}">
      ${inner}<div class="gplus">${IC.plus(Math.round(cell * .52))}</div></div>`;
}

/* ------------------------- zoom / pan gestures ----------------------------- */
const gest = { pts: new Map(), mode: null, sx: 0, sy: 0, px: 0, py: 0, k: 1, dist: 0, moved: false };
let swallowClick = false;

const areaCentre = area => {
  const r = area.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
};

$app.addEventListener('pointerdown', e => {
  const area = e.target.closest('.board-area');
  if (!area || !zoomable()) return;
  gest.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (gest.pts.size === 1) {
    gest.mode = 'pan'; gest.moved = false;
    gest.sx = e.clientX; gest.sy = e.clientY; gest.px = view.px; gest.py = view.py;
  } else if (gest.pts.size === 2) {
    const [a, b] = [...gest.pts.values()];
    gest.mode = 'pinch'; gest.moved = true;
    gest.dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    gest.k = view.k; gest.px = view.px; gest.py = view.py;
  }
  document.querySelector('.board')?.classList.add('nudge');
});

$app.addEventListener('pointermove', e => {
  if (!gest.pts.has(e.pointerId)) return;
  gest.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const area = document.getElementById('boardArea');
  if (!area) return;

  if (gest.mode === 'pan' && gest.pts.size === 1) {
    const dx = e.clientX - gest.sx, dy = e.clientY - gest.sy;
    if (!gest.moved && Math.hypot(dx, dy) < 6) return;
    gest.moved = true;
    view.px = gest.px + dx; view.py = gest.py + dy;
    applyView();
  } else if (gest.mode === 'pinch' && gest.pts.size === 2) {
    const [a, b] = [...gest.pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const c = areaCentre(area);
    const qx = (a.x + b.x) / 2 - c.x, qy = (a.y + b.y) / 2 - c.y;
    const k2 = clamp(gest.k * (d / gest.dist), geo.kFit, 1);
    const f = k2 / view.k;
    view.px = qx - (qx - view.px) * f;
    view.py = qy - (qy - view.py) * f;
    view.k = k2;
    applyView();
  }
});

function endGesture(e) {
  if (!gest.pts.has(e.pointerId)) return;
  gest.pts.delete(e.pointerId);
  if (gest.moved) { swallowClick = true; setTimeout(() => swallowClick = false, 0); }
  if (!gest.pts.size) { gest.mode = null; document.querySelector('.board')?.classList.remove('nudge'); }
}
$app.addEventListener('pointerup', endGesture);
$app.addEventListener('pointercancel', endGesture);

$app.addEventListener('wheel', e => {
  const area = e.target.closest('.board-area');
  if (!area || !zoomable()) return;
  e.preventDefault();
  const c = areaCentre(area);
  zoomTo(view.k * Math.exp(-e.deltaY * 0.0016), e.clientX - c.x, e.clientY - c.y);
}, { passive: false });

/* ----------------------- little boards for the tutorial -------------------- */
function miniBoard(spec, ghost, cell = 32) {
  const rows = spec.length, cols = spec[0].length;
  const lw = Math.max(2, Math.round(cell * .095)), rad = Math.round(cell * .24);
  const W = cols * cell, H = rows * cell;
  let inner = '';
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const ch = spec[r][c];
    if (ch === 'X' || ch === 'O')
      inner += `<div class="cell" style="left:${c * cell}px;top:${r * cell}px;width:${cell}px;height:${cell}px">${mark(ch, cell * .775)}</div>`;
  }
  inner += gridLines(rows, cols, cell, lw, '#000');
  if (ghost === 'row') inner += strip('top', rows, cols, cell, lw, rad) + strip('bottom', rows, cols, cell, lw, rad);
  if (ghost === 'col') inner += strip('left', rows, cols, cell, lw, rad) + strip('right', rows, cols, cell, lw, rad);
  const mv = ghost === 'row' ? cell : 0, mh = ghost === 'col' ? cell : 0;
  return `<div class="board static" style="width:${W}px;height:${H}px;margin:${mv}px ${mh}px">${inner}</div>`;
}

/* ================================== events ================================= */
$app.addEventListener('click', e => {
  if (swallowClick) return;

  // a tap anywhere outside an open dropdown just closes it
  if ((S.modeOpen || S.langOpen) && !e.target.closest('.selwrap')) {
    S.modeOpen = S.langOpen = false; return render();
  }

  const el = e.target.closest('[data-act]');
  if (!el) return;

  switch (el.dataset.act) {
    case 'modeMenu':    S.modeOpen = !S.modeOpen; S.langOpen = false; break;
    case 'langMenu':    S.langOpen = !S.langOpen; S.modeOpen = false; break;
    case 'pickMode':    applyMode(el.dataset.key); break;
    case 'pickLang':    applyLang(el.dataset.key); break;
    case 'go':          S.stack = el.dataset.to === 'home' ? [] : [...S.stack, S.screen];
                        S.screen = el.dataset.to; S.dialog = null; S.modeOpen = S.langOpen = false; break;
    case 'back':        S.screen = S.stack.pop() || 'home'; break;
    case 'play':        cancelBot();
                        S.game = newGame(el.dataset.bot === '1', el.dataset.level);
                        S.stack = []; S.screen = 'game'; S.modeOpen = S.langOpen = false;
                        S.dialog = null; S.lastPlaced = null; resetView(); clockRef = Date.now(); break;

    case 'pickHuman':   S.humanPiece = el.dataset.key === 'X' ? 'X' : 'O'; store.save(); break;
    case 'pickStart':   S.startPiece = el.dataset.key === 'X' ? 'X' : 'O'; store.save(); break;

    case 'toggleTime':      S.timeLimit   = !S.timeLimit;   store.save(); break;
    case 'toggleCentre':    S.blockCentre = !S.blockCentre; store.save(); break;
    case 'toggleUndo':      S.undoOn      = !S.undoOn;      store.save(); break;
    case 'toggleUnlimited': S.unlimited   = !S.unlimited;   store.save(); break;

    case 'place':       return place(+el.dataset.r, +el.dataset.c);
    case 'extend':      return extend(el.dataset.side);
    case 'zoom':        return zoomTo(view.k * (+el.dataset.dir > 0 ? 1.6 : 1 / 1.6));
    case 'undo':        if (!S.undoOn) { S.dialog = 'undoOff'; break; } return undo();
    case 'askEnd':      S.dialog = 'end'; cancelBot(); break;
    case 'closeDialog': S.dialog = null; clockRef = Date.now(); break;
    case 'endGame':     cancelBot(); S.dialog = null; S.game = null; S.stack = []; S.screen = 'home'; break;
    default: return;
  }
  render();
});

/* editable number fields ---------------------------------------------------- */
$app.addEventListener('focusin', e => { if (e.target.matches('[data-num]')) e.target.select(); });
$app.addEventListener('input', e => {
  if (!e.target.matches('[data-num]')) return;
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 2);
});
/* picking a mode also resets the board-size limits and the clock to its defaults */
function applyMode(key) {
  const m = MODES[key] ? key : 'fast';
  S.mode = m;
  S.maxW  = MODES[m].w;   S.maxH  = MODES[m].h;    // portrait
  S.maxWL = MODES[m].wl;  S.maxHL = MODES[m].hl;   // wide landscape
  S.minutes = MODES[m].min;
  S.modeOpen = false;
  store.save();
}

/* language only changes wording — never any rule, size or layout value */
function applyLang(key) {
  S.lang = LANGS[key] ? key : 'en';
  S.langOpen = false;
  document.documentElement.lang = S.lang;
  store.save();
}

$app.addEventListener('change', e => {
  const el = e.target.closest('[data-num]');
  if (!el) return;
  const spec = NUM[el.dataset.num];
  const raw = parseInt(el.value, 10);
  S[spec.key()] = clamp(Number.isFinite(raw) ? raw : spec.def, spec.min, spec.max());
  store.save();
  render();
});
$app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('[data-num]')) { e.preventDefault(); e.target.blur(); }
  if (e.key === 'Escape' && (S.modeOpen || S.langOpen)) { S.modeOpen = S.langOpen = false; render(); }
});

document.documentElement.lang = S.lang;
render();
